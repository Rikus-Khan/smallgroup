<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Bible Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --night: #0d1030;
  --dusk: #4c2747;
  --flame: #f2b24c;
  --flame-hot: #ffe2a3;
  --parch: #f1e6cf;
  --mist: #aeadcb;
  --line: rgb(241 230 207 / .16);
  --ot: #8a5a3c;
  --nt: #3d4a8a;
  --topic: #2f6b5e;
  --doctrine: #6b3a5e;
  --concept: #7a6a2e;
  --book: #4a4a6a;
  --wood: #3a2a24;
  --leather: #24463c;
  --serif: 'Spectral', Georgia, serif;
  --sans: 'Atkinson Hyperlegible', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background:
    radial-gradient(120% 50% at 50% 110%, rgb(242 178 76 / .22), transparent 70%),
    linear-gradient(180deg, var(--night), var(--dusk));
  background-attachment: fixed;
  color: var(--parch); font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--flame-hot); outline-offset: 3px; }
/* The page runs the full width of the window, with a gap at each side; the reading parts keep a comfortable measure */
main { --gutter: clamp(16px, 3vw, 56px); width: calc(100% - 2 * var(--gutter)); margin: 0 auto; padding: clamp(32px, 7vh, 80px) 0 72px; }
.newest, footer { max-width: 60rem; }

h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2.5rem, 1.6rem + 5vw, 4.4rem); line-height: 1; margin: 0 0 .25em; }
.intro { color: var(--mist); font-size: 1.1rem; line-height: 1.5; margin: 0 0 2rem; max-width: 32em; }

/* Newest study */
.newest {
  display: grid; gap: .2rem 1.5rem; align-items: center;
  padding: 1.1rem 1.3rem; margin-bottom: 2.6rem;
  border-left: 3px solid var(--flame); background: rgb(255 255 255 / .05);
}
@media (min-width: 640px) {
  .newest { grid-template-columns: 1fr auto; }
  .newest > :not(.btns) { grid-column: 1; }
  .newest .btns { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; }
}
.newest .label { color: var(--flame); font-weight: 700; font-size: .95rem; margin: 0; }
.newest h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.6rem, 1.3rem + 1.2vw, 2.1rem); margin: 0; }
.newest .sub { font-family: var(--serif); font-style: italic; color: var(--flame-hot); font-size: 1.15rem; margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .8rem; }
.btn {
  display: inline-block; padding: .65em 1.2em; border-radius: 999px; text-decoration: none; font-weight: 700;
  border: 1.5px solid var(--flame); color: var(--flame-hot); background: none;
}
.btn.primary { background: var(--flame); color: #1a1230; }
.btn:hover { background: var(--flame-hot); color: #1a1230; border-color: var(--flame-hot); }

/* The bookcase: wooden sides, a top, a plinth, and one section of shelves per kind of book.
   Spines wrap onto as many shelves as the width needs; every row is --row tall (set per section from its tallest spine) with a board under it. */
.bookcase {
  --wood-lip: #5c4334; --wood-dark: #241914; --side: clamp(12px, 1.3vw, 22px); --inset: clamp(10px, 1.8vw, 30px);
  --row: 262px; --board: 14px;
  position: relative; padding: 16px var(--side) 0;
  border-radius: 6px 6px 2px 2px;
  background:
    repeating-linear-gradient(90deg, rgb(255 255 255 / .035) 0 2px, transparent 2px 9px),
    linear-gradient(180deg, var(--wood-lip), var(--wood) 16px);
  box-shadow: 0 24px 40px -18px rgb(0 0 0 / .8), inset 0 1px 0 rgb(255 255 255 / .12);
}
.bookcase::after {   /* the plinth */
  content: ""; display: block; height: 22px; margin: 0 calc(-1 * var(--side));
  border-radius: 0 0 2px 2px;
  background: linear-gradient(180deg, var(--wood-dark), var(--wood) 5px, var(--wood-dark));
}
.case-sec {
  padding: 1.1rem var(--inset) 0;
  background:
    linear-gradient(180deg, rgb(0 0 0 / .4), transparent 16px),
    linear-gradient(90deg, rgb(0 0 0 / .3), transparent 22px, transparent calc(100% - 22px), rgb(0 0 0 / .3)),
    #1c1426;
}
.shelf-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .4rem 1rem; margin: 0 0 .3rem; }
.shelf-head h3 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.25rem; color: var(--mist); margin: 0; }
.shelf-head .count { font-size: .85rem; color: var(--mist); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .85rem; color: var(--mist); margin: 0; padding: 0; list-style: none; }
.legend span { display: inline-block; width: .75em; height: .75em; border-radius: 2px; margin-right: .35em; vertical-align: -.05em; }
.shelf {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--board) 5px;
  margin: 0 calc(-1 * var(--inset)); padding: 0 var(--inset) var(--board);
  background: repeating-linear-gradient(180deg,
    transparent 0 var(--row),
    var(--wood-lip) var(--row) calc(var(--row) + 2px),
    var(--wood) calc(var(--row) + 2px) calc(var(--row) + var(--board) - 3px),
    var(--wood-dark) calc(var(--row) + var(--board) - 3px) calc(var(--row) + var(--board)));
}
.case-sec .open-book { max-width: 64rem; margin: 1.6rem auto; }
.case-sec:has(.open-book:last-child) { padding-bottom: .2rem; }

.spine {
  flex: none; position: relative; border: 0; padding: 22px 0 18px;
  border-radius: 3px 3px 0 0;
  writing-mode: vertical-rl;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--serif); font-weight: 600; font-size: 1.05rem; letter-spacing: .02em; color: var(--parch);
  white-space: nowrap; gap: 10px;
  box-shadow: inset -7px 0 10px rgb(0 0 0 / .28), inset 3px 0 0 rgb(255 255 255 / .12);
  transition: transform .25s ease;
}
/* gold bands near the top and bottom of each spine */
.spine::before, .spine::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: rgb(255 226 163 / .55); }
.spine::before { top: 10px; }
.spine::after { bottom: 8px; }
.spine.long { font-size: .9rem; }
.spine small { font-family: var(--sans); font-weight: 700; font-size: .7rem; opacity: .8; }
.spine:hover { transform: translateY(-6px); }
.spine[aria-expanded="true"] { transform: translateY(-16px); box-shadow: inset -7px 0 10px rgb(0 0 0 / .28), inset 3px 0 0 rgb(255 255 255 / .12), 0 0 18px rgb(242 178 76 / .55); }
.spine.ot, .spine.nt { justify-content: center; }   /* a Bible book shows only its name, centered */
.spine.ot { background: var(--ot); }
.spine.nt { background: var(--nt); }
.spine.topic { background: var(--topic); }
.spine.doctrine { background: var(--doctrine); }
.spine.concept { background: var(--concept); }
.spine.book { background: var(--book); }
.spine.ref { background: var(--leather); }
a.spine { text-decoration: none; }
.spine.ref::before, .spine.ref::after { height: 3px; background: rgb(226 190 110 / .8); }

/* The book you pulled off the shelf: it opens into a two-page spread */
.open-book {
  --paper: #f3ead6; --ink: #2a2320; --ink-soft: #6b5d52; --ribbon: #8b1e2b;
  margin-top: 1.6rem; padding: 10px; border-radius: 8px;
  background: var(--cover); perspective: 1800px;
  display: grid; grid-template-columns: 1fr;
  box-shadow: 0 20px 34px -14px rgb(0 0 0 / .7), inset 0 0 0 1px rgb(255 255 255 / .12);
}
.open-book.nt { --cover: var(--nt); }
.open-book.ot { --cover: var(--ot); }
.open-book.topic { --cover: var(--topic); }
.open-book.doctrine { --cover: var(--doctrine); }
.open-book.concept { --cover: var(--concept); }
.page {
  position: relative; color: var(--ink); padding: 1.6rem 1.5rem 1.8rem;
  background-color: var(--paper);
  box-shadow: 0 2px 0 #e3d7bd, 0 4px 0 #d5c7aa;   /* the edges of the pages underneath */
}
.page.left {
  text-align: center; border-radius: 4px 4px 0 0; transform-origin: center bottom;
  background-image: linear-gradient(to top, rgb(0 0 0 / .13), transparent 10%);
  animation: open-top .7s cubic-bezier(.2,.7,.2,1) both;
}
.page.right {
  border-radius: 0 0 4px 4px; transform-origin: center top;
  background-image: linear-gradient(to bottom, rgb(0 0 0 / .13), transparent 10%);
  animation: open-bottom .7s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes open-top { from { transform: rotateX(-70deg); opacity: 0; } }
@keyframes open-bottom { from { transform: rotateX(70deg); opacity: 0; } }
@media (min-width: 700px) {
  .open-book { grid-template-columns: 1fr 1fr; }
  .page.left { border-radius: 4px 0 0 4px; transform-origin: right center; background-image: linear-gradient(to left, rgb(0 0 0 / .15), transparent 10%); animation-name: open-left; }
  .page.right { border-radius: 0 4px 4px 0; transform-origin: left center; background-image: linear-gradient(to right, rgb(0 0 0 / .15), transparent 10%); animation-name: open-right; }
}
@keyframes open-left { from { transform: rotateY(75deg); opacity: 0; } }
@keyframes open-right { from { transform: rotateY(-75deg); opacity: 0; } }

/* Left page: the title page */
.ribbon {
  position: absolute; top: -10px; right: 1.6rem; width: 22px; height: 86px; background: var(--ribbon);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
}
.title-page { display: flex; flex-direction: column; align-items: center; padding-top: 1.2rem; margin-bottom: 1.8rem; }
.title-page h4 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.6rem, 2rem + 3vw, 3.8rem); line-height: 1; margin: .1em 0 .25em; }
.flourish { width: 7rem; height: 1px; background: var(--ink-soft); position: relative; margin: .2rem auto .9rem; }
.flourish::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; background: var(--paper); border: 1px solid var(--ink-soft); transform: translate(-50%, -50%) rotate(45deg); }
.title-page .progress { color: var(--ink-soft); margin: 0 0 .7rem; }
.marks { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 16rem; margin: 0 auto 1.3rem; }
.marks i { width: 9px; height: 14px; border-radius: 1px; background: rgb(42 35 32 / .14); }
.marks i.done { background: var(--ribbon); }
.marks-bar { width: 14rem; max-width: 100%; height: 8px; border-radius: 4px; background: rgb(42 35 32 / .14); margin: 0 auto 1.3rem; overflow: hidden; }
.marks-bar i { display: block; height: 100%; background: var(--ribbon); }
.ink-btn {
  display: inline-block; padding: .55em 1.1em; border-radius: 999px; text-decoration: none; font-weight: 700;
  border: 1.5px solid var(--ink); color: var(--ink);
}
.ink-btn:hover { background: var(--ink); color: var(--paper); }

/* The table of contents: starts under the title on the left page, continues on the right */
.page.left .toc { text-align: left; }
.end-mark { height: 100%; min-height: 8rem; display: grid; place-items: center; }
.end-mark .flourish { width: 5rem; }
@media (max-width: 699px) {
  .open-book.short .page.right { display: none; }   /* nothing to turn to on a phone */
  .open-book.short .page.left { border-radius: 4px; background-image: none; }
}
.page h5 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.6rem; text-align: center; margin: 0 0 .8rem; }
.toc { list-style: none; margin: 0; padding: 0; }
.toc a {
  width: 100%; display: flex; text-decoration: none; align-items: baseline; gap: .55rem; text-align: left;
  padding: .6rem .35rem; border: 0; border-radius: 4px; background: none; color: var(--ink);
  font-family: var(--serif); font-size: 1.15rem; line-height: 1.3;
}
.toc a:hover { background: rgb(139 30 43 / .08); }
.toc .num { flex: none; min-width: 1.4em; font-weight: 600; color: var(--ribbon); }
.toc .t { flex: 0 1 auto; font-style: italic; }
.toc .lead { flex: 1 1 1.5rem; border-bottom: 2px dotted rgb(42 35 32 / .35); transform: translateY(-.28em); }
.toc .go { flex: none; font-family: var(--sans); font-size: .9rem; font-weight: 700; color: var(--ribbon); }
.open-book :focus-visible { outline-color: var(--ribbon); }

@media (prefers-reduced-motion: reduce) {
  .page { animation: none !important; }
}

/* Book card: the hover tip on a spine, and the same facts on the open book's title page */
.book-tip {
  position: fixed; z-index: 8; width: min(22rem, calc(100vw - 24px)); padding: .9rem 1rem 1rem;
  background: #1b1638; border: 1px solid var(--flame); border-radius: 10px;
  box-shadow: 0 14px 30px -10px rgb(0 0 0 / .8);
  opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .15s, transform .15s;
}
.book-tip.show { opacity: 1; transform: none; }
.book-tip h4 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; line-height: 1.1; margin: .1rem 0 .35rem; }
.book-tip .sec { font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--flame); margin: 0; }
.book-tip .count { color: var(--mist); font-size: .9rem; margin: 0 0 .5rem; }
.book-tip .sum { font-family: var(--serif); font-size: 1.05rem; line-height: 1.4; margin: 0 0 .6rem; }
.themes { display: flex; flex-wrap: wrap; gap: .3rem; margin: 0 0 .65rem; padding: 0; list-style: none; }
.themes li { font-size: .8rem; font-weight: 700; padding: .2em .65em; border-radius: 999px; background: rgb(242 178 76 / .16); color: var(--flame-hot); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .15rem .7rem; font-size: .9rem; margin: 0 0 .6rem; }
.facts dt { color: var(--mist); }
.facts dd { margin: 0; }
.why { font-size: .92rem; line-height: 1.4; margin: 0; padding-left: .7rem; border-left: 2px solid var(--flame); }
.why b { display: block; font-size: .75rem; letter-spacing: .04em; color: var(--flame); }
/* the same card on the paper title page */
.page-card { max-width: 24rem; margin: 0 auto 1.3rem; text-align: left; }
.page-card .sec { font-family: var(--sans); font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ribbon); text-align: center; margin: 0 0 .5rem; }
.page-card .sum { font-family: var(--serif); font-style: italic; font-size: 1.1rem; line-height: 1.4; text-align: center; margin: 0 0 .7rem; }
.page-card .themes { justify-content: center; }
.page-card .themes li { background: rgb(139 30 43 / .1); color: var(--ribbon); }
.page-card .facts { color: var(--ink); width: fit-content; margin: 0 auto .7rem; }
.page-card .facts dt { color: var(--ink-soft); }
.page-card .why { border-color: var(--ribbon); color: var(--ink); }
.page-card .why b { color: var(--ribbon); }
@media (hover: none) { .book-tip { display: none; } }


footer { margin-top: 3rem; color: var(--mist); font-size: .95rem; }

/* Title row: the About button sits at the right edge of the content.
   On a narrow phone it wraps above the title, still on the right. */
.masthead { display: flex; flex-wrap: wrap-reverse; align-items: center; gap: .6rem 1rem; }
.masthead h1 { margin-bottom: 0; }
.masthead + .intro { margin-top: .3em; }
.about-btn {
  margin-left: auto; padding: .5em 1.1em; border-radius: 999px; text-decoration: none; font-weight: 700;
  border: 1.5px solid rgb(241 230 207 / .35); color: var(--parch);
}
.about-btn:hover { border-color: var(--flame); color: var(--flame-hot); }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <h1>Daily Bible Study</h1>
    <a class="about-btn" href="about.html">About</a>
  </header>
  <p class="intro">Pull a book off the shelf to see every chapter we've studied in it.</p>

  <section class="newest" id="newest" aria-label="Newest study"></section>

  <div id="shelves"></div>

  <footer>Scripture quotations are from the King James Version.</footer>
</main>

<div class="book-tip" id="book-tip" role="tooltip"></div>

<script src="bible.js"></script>
<script src="studies.js"></script>
<script src="glossary.js"></script>
<script src="book-info.js"></script>
<script>
const BIBLE_BOOKS = window.BIBLE_BOOKS;
const BOOK_INDEX = Object.fromEntries(BIBLE_BOOKS.map(([name], k) => [name, k]));
const CHAPTERS = Object.fromEntries(BIBLE_BOOKS);
const FIRST_NT = BOOK_INDEX["Matthew"];
const KINDS = {
  topic: { one: "Topic", many: "Topics" },
  doctrine: { one: "Doctrine", many: "Doctrines" },
  concept: { one: "Concept", many: "Concepts" },
  book: { one: "Book overview", many: "Book overviews" }
};

const studies = window.STUDIES || [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
let openBook = null;

// ---------- Newest study ----------
function drawNewest() {
  const s = [...studies].sort((a, b) => b.date.localeCompare(a.date))[0];
  const box = document.getElementById("newest");
  if (!s) { box.hidden = true; return; }
  box.innerHTML = `<p class="label">Newest study</p>
    <h2>${esc(s.title)}</h2>
    <p class="sub">${esc(s.sub)}</p>
    <div class="btns">${studyButtons(s)}</div>`;
}
function studyButtons(s) {
  return `<a class="btn primary" href="${esc(s.url)}">Start the study</a>` +
    (s.overview ? `<a class="btn" href="overview.html?id=${encodeURIComponent(s.id)}">${s.type === "chapter" ? "Chapter overview" : "Overview"}</a>` : "");
}

// ---------- Book cards ----------
const SECTIONS = [[5, "Law"], [17, "History"], [22, "Poetry and wisdom"], [27, "Major Prophets"], [39, "Minor Prophets"],
  [43, "Gospels"], [44, "History"], [57, "Paul's letters"], [65, "General letters"], [66, "Prophecy"]];
const sectionOf = book => SECTIONS.find(([end]) => BOOK_INDEX[book] < end)[1];
const studiedIn = book => studies.filter(s => s.type === "chapter" && s.book === book).length;
function bookCard(book) {
  const info = (window.BOOK_INFO || {})[book];
  if (!info) return "";
  return `<p class="sec">${sectionOf(book)}</p>
    <p class="sum">${esc(info.summary)}</p>
    <ul class="themes" aria-label="Major themes">${info.themes.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    <dl class="facts"><dt>Written by</dt><dd>${esc(info.author)}</dd><dt>When</dt><dd>${esc(info.written)}</dd></dl>
    <p class="why"><b>WHY IT MATTERS TO US</b>${esc(info.recovery)}</p>`;
}

// Hover (or keyboard focus) on a book's spine shows its card after a short pause
const tip = document.getElementById("book-tip");
let tipTimer = 0, tipFor = null;
function showTip(spine) {
  const book = spine.dataset.key.slice(5), info = (window.BOOK_INFO || {})[book];
  if (!info) return;
  const n = studiedIn(book);
  tip.innerHTML = `<h4>${esc(book)}</h4><p class="count">${n} of ${plural(CHAPTERS[book], "chapter")} studied</p>${bookCard(book)}`;
  tip.classList.add("show");
  const r = spine.getBoundingClientRect(), t = tip.getBoundingClientRect(), pad = 12;
  const left = Math.min(Math.max(pad, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - pad);
  const top = r.top - t.height - 10 >= pad ? r.top - t.height - 10 : Math.min(r.bottom + 10, innerHeight - t.height - pad);
  tip.style.left = left + "px"; tip.style.top = Math.max(pad, top) + "px";
  tipFor = spine;
}
function hideTip() { clearTimeout(tipTimer); tip.classList.remove("show"); tipFor = null; }
function wireTips(root) {
  root.querySelectorAll('.spine[data-key^="book:"]').forEach(sp => {
    sp.setAttribute("aria-describedby", "book-tip");
    const later = () => { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(sp), 350); };
    sp.addEventListener("mouseenter", later);
    sp.addEventListener("focus", () => { if (sp.matches(":focus-visible")) later(); });
    sp.addEventListener("mouseleave", hideTip);
    sp.addEventListener("blur", hideTip);
    sp.addEventListener("click", hideTip);
  });
}
addEventListener("scroll", () => tipFor && hideTip(), { passive: true });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });

// ---------- Shelves ----------
function spine(cls, label, note, key, height, width) {
  return `<button class="spine ${cls}${label.length > 9 ? " long" : ""}" type="button" data-key="${esc(key)}" aria-expanded="${openBook === key}"
    style="height:${height}px;width:${width}px" aria-label="${esc(label)}, ${esc(note)}">${esc(label)}${cls === "ot" || cls === "nt" ? "" : `<small>${esc(note)}</small>`}</button>`;
}

function drawShelves() {
  const chapters = studies.filter(s => s.type === "chapter" || s.type === "book");
  const books = [...new Set(chapters.map(s => s.book))].sort((a, b) => BOOK_INDEX[a] - BOOK_INDEX[b]);
  const others = studies.filter(s => KINDS[s.type] && s.type !== "book")
    .sort((a, b) => a.type.localeCompare(b.type) || a.title.localeCompare(b.title));
  let html = "";

  for (const [cls, name, inT] of [["ot", "Old Testament", b => BOOK_INDEX[b] < FIRST_NT], ["nt", "New Testament", b => BOOK_INDEX[b] >= FIRST_NT]]) {
    const shelf = books.filter(inT);
    if (!shelf.length) continue;
    const total = studies.filter(s => s.type === "chapter" && shelf.includes(s.book)).length;
    html += `<section class="case-sec" aria-label="${name}">
      <div class="shelf-head"><h3>${name}</h3><p class="count">${plural(shelf.length, "book")}, ${plural(total, "chapter")}</p></div>
      <div class="shelf">${shelf.map(b => {
        const n = studies.filter(s => s.type === "chapter" && s.book === b).length;
        // taller for longer books; thicker as more of the book gets studied
        const height = 175 + Math.round(Math.min(CHAPTERS[b], 50) * 1.2);
        const width = Math.min(52 + n * 3, 96);
        return spine(cls, b, plural(n, "chapter"), "book:" + b, height, width);
      }).join("")}</div>
      ${openBook?.startsWith("book:") && shelf.includes(openBook.slice(5)) ? drawOpenBook(openBook.slice(5)) : ""}</section>`;
  }

  if (others.length) {
    const kinds = [...new Set(others.map(s => s.type))];
    html += `<section class="case-sec" aria-label="Topics, doctrines, and more">
      <div class="shelf-head"><h3>Topics, doctrines, and more</h3><ul class="legend">
      ${kinds.map(k => `<li><span style="background:var(--${k})"></span>${KINDS[k].many}</li>`).join("")}</ul></div>
      <div class="shelf">${others.map(s => spine(s.type, s.title, KINDS[s.type].one, "study:" + s.id, 215 + (s.title.length % 5) * 7, 58)).join("")}</div>
      ${others.filter(s => openBook === "study:" + s.id).map(drawOpenTopic).join("")}</section>`;
  }

  // Reference set: the glossary, one volume per kind of entry
  const glossary = window.GLOSSARY || [];
  const volumes = [["person", "People", "people"], ["place", "Places", "places"], ["term", "Words & ideas", "words"]]
    .filter(([kind]) => glossary.some(e => e.kind === kind));
  if (volumes.length) {
    html += `<section class="case-sec" aria-label="Reference">
      <div class="shelf-head"><h3>Reference</h3><ul class="legend"><li><span style="background:var(--leather)"></span>Glossary</li></ul></div>
      <div class="shelf">${volumes.map(([kind, label, hash]) =>
        `<a class="spine ref${label.length > 9 ? " long" : ""}" href="glossary.html#${hash}" style="height:236px;width:64px"
          aria-label="Glossary: ${esc(label)}, ${glossary.filter(e => e.kind === kind).length} entries">${esc(label)}<small>Glossary</small></a>`).join("")}</div></section>`;
  }

  const root = document.getElementById("shelves");
  root.innerHTML = html ? `<div class="bookcase">${html}</div>` : "";
  // every spine stands on the board: give each row of a shelf the same height, a little above its tallest book
  root.querySelectorAll(".shelf").forEach(shelf => {
    const spines = [...shelf.children], tall = h => parseFloat(h.style.height);
    const row = Math.max(...spines.map(tall)) + 22;
    shelf.style.setProperty("--row", row + "px");
    spines.forEach(sp => sp.style.marginTop = row - tall(sp) + "px");
  });
  wireTips(root);
  root.querySelectorAll("[data-key]").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.key;
    openBook = openBook === key ? null : key;
    history.replaceState(null, "", openBook ? "#" + openBook.replace(":", "=") : location.pathname + location.search);
    drawShelves();
    const panel = document.getElementById("open-book");
    if (panel) panel.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }));
  balanceToc();
}

const FEW_CHAPTERS = 5;   // a book with this many studied chapters or fewer keeps its whole contents on the left page
function drawOpenBook(book) {
  const chs = studies.filter(s => s.type === "chapter" && s.book === book).sort((a, b) => a.ch - b.ch);
  const hasOverview = chs.some(c => c.overview);
  const done = new Set(chs.map(c => c.ch));
  const short = chs.length <= FEW_CHAPTERS;
  return `<div class="open-book ${BOOK_INDEX[book] >= FIRST_NT ? "nt" : "ot"}${short ? " short" : ""}" id="open-book">
    <div class="page left">
      <span class="ribbon" aria-hidden="true"></span>
      <div class="title-page">
        <h4>${esc(book)}</h4>
        <div class="flourish" aria-hidden="true"></div>
        ${CHAPTERS[book] <= 52
          ? `<div class="marks" aria-hidden="true">${Array.from({ length: CHAPTERS[book] }, (_, k) => `<i class="${done.has(k + 1) ? "done" : ""}"></i>`).join("")}</div>`
          : `<div class="marks-bar" aria-hidden="true"><i style="width:${Math.max(2, chs.length / CHAPTERS[book] * 100)}%"></i></div>`}
        <div class="page-card">${bookCard(book)}</div>
        ${hasOverview ? `<a class="ink-btn" href="overview.html?book=${encodeURIComponent(book)}">Book overview</a>` : ""}
      </div>
      <h5>Contents</h5>
      <ol class="toc" id="toc-left">${chs.map(tocItem).join("")}</ol>
    </div>
    <div class="page right">
      ${short ? `<div class="end-mark" aria-hidden="true"><div class="flourish"></div></div>` : `<ol class="toc" id="toc-right"></ol>`}
    </div>
  </div>`;
}

// A topic, doctrine or concept opens like a Bible book: its title page, and the one study as its contents
function drawOpenTopic(s) {
  return `<div class="open-book ${s.type} short" id="open-book">
    <div class="page left">
      <span class="ribbon" aria-hidden="true"></span>
      <div class="title-page">
        <h4>${esc(s.title)}</h4>
        <div class="flourish" aria-hidden="true"></div>
        <div class="page-card"><p class="sec">${esc(KINDS[s.type].one)}</p><p class="sum">${esc(s.about)}</p></div>
      </div>
      <h5>Contents</h5>
      <ol class="toc" id="toc-left">${tocItem({ ...s, ch: 1 })}</ol>
    </div>
    <div class="page right"><div class="end-mark" aria-hidden="true"><div class="flourish"></div></div></div>
  </div>`;
}

// The contents start under the title on the left page and flow onto the right page,
// split so both pages end about level, but with at least a third of the chapters on the left
function balanceToc() {
  const left = document.getElementById("toc-left"), right = document.getElementById("toc-right");
  if (!left || !right) return;
  left.append(...right.children);
  const items = [...left.children], heights = items.map(li => li.offsetHeight);
  const total = heights.reduce((a, b) => a + b, 0);
  // offsetTop ignores the page-turn transform, so this measures correctly mid-animation
  let k = Math.ceil(items.length / 3), best = Infinity, above = 0;
  for (let n = 1; n < items.length; n++) {
    above += heights[n - 1];
    if (n < Math.ceil(items.length / 3)) continue;
    const tallest = Math.max(left.offsetTop + above, right.offsetTop + total - above);
    if (tallest < best) { best = tallest; k = n; }
  }
  right.append(...items.slice(k));
}
let balanceQueued = false;
addEventListener("resize", () => {
  if (balanceQueued) return;
  balanceQueued = true;
  requestAnimationFrame(() => { balanceQueued = false; balanceToc(); });
});
document.fonts?.ready.then(balanceToc);
function tocItem(c) {
  return `<li><a href="${esc(c.url)}" aria-label="${esc(c.title)}: ${esc(c.sub)}">
    <span class="num">${c.ch}</span><span class="t">${esc(c.sub)}</span><span class="lead" aria-hidden="true"></span><span class="go" aria-hidden="true">Open</span>
  </a></li>`;
}

drawNewest();
const [, linkKind, linkedRaw] = location.hash.match(/^#(book|study)=(.+)$/) || [];
const linked = decodeURIComponent(linkedRaw || "");
if (linkKind === "book" && studies.some(s => s.book === linked && s.type === "chapter")) openBook = "book:" + linked;
if (linkKind === "study" && studies.some(s => s.id === linked && KINDS[s.type])) openBook = "study:" + linked;
drawShelves();
if (openBook) document.getElementById("open-book")?.scrollIntoView({ block: "start" });
</script>
</body>
</html>
