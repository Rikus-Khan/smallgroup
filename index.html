<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Bible Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --night: #0d1030;
  --dusk: #4c2747;
  --flame: #f2b24c;
  --flame-hot: #ffe2a3;
  --parch: #f1e6cf;
  --mist: #aeadcb;
  --line: rgb(241 230 207 / .16);
  --ot: #8a5a3c;
  --nt: #3d4a8a;
  --topic: #2f6b5e;
  --doctrine: #6b3a5e;
  --concept: #7a6a2e;
  --book: #4a4a6a;
  --wood: #3a2a24;
  --serif: 'Spectral', Georgia, serif;
  --sans: 'Atkinson Hyperlegible', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background:
    radial-gradient(120% 50% at 50% 110%, rgb(242 178 76 / .22), transparent 70%),
    linear-gradient(180deg, var(--night), var(--dusk));
  background-attachment: fixed;
  color: var(--parch); font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--flame-hot); outline-offset: 3px; }
main { width: min(100% - 32px, 60rem); margin: 0 auto; padding: clamp(32px, 7vh, 80px) 0 72px; }

h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2.5rem, 1.6rem + 5vw, 4.4rem); line-height: 1; margin: 0 0 .25em; }
.intro { color: var(--mist); font-size: 1.1rem; line-height: 1.5; margin: 0 0 2rem; max-width: 32em; }

/* Newest study */
.newest {
  display: grid; gap: .2rem 1.5rem; align-items: center;
  padding: 1.1rem 1.3rem; margin-bottom: 2.6rem;
  border-left: 3px solid var(--flame); background: rgb(255 255 255 / .05);
}
@media (min-width: 640px) {
  .newest { grid-template-columns: 1fr auto; }
  .newest > :not(.btns) { grid-column: 1; }
  .newest .btns { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; }
}
.newest .label { color: var(--flame); font-weight: 700; font-size: .95rem; margin: 0; }
.newest h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.6rem, 1.3rem + 1.2vw, 2.1rem); margin: 0; }
.newest .sub { font-family: var(--serif); font-style: italic; color: var(--flame-hot); font-size: 1.15rem; margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .8rem; }
.btn {
  display: inline-block; padding: .65em 1.2em; border-radius: 999px; text-decoration: none; font-weight: 700;
  border: 1.5px solid var(--flame); color: var(--flame-hot); background: none;
}
.btn.primary { background: var(--flame); color: #1a1230; }
.btn:hover { background: var(--flame-hot); color: #1a1230; border-color: var(--flame-hot); }

/* Shelves */
.shelf-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .4rem 1rem; margin: 0 0 .6rem; }
.shelf-head h3 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.25rem; color: var(--mist); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .85rem; color: var(--mist); margin: 0; padding: 0; list-style: none; }
.legend span { display: inline-block; width: .75em; height: .75em; border-radius: 2px; margin-right: .35em; vertical-align: -.05em; }
.shelf {
  display: flex; align-items: flex-end; gap: 5px;
  padding: 18px 12px 0; min-height: 230px;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
  border-bottom: 12px solid var(--wood);
  box-shadow: 0 10px 16px -6px rgb(0 0 0 / .5);
  background: linear-gradient(180deg, transparent 60%, rgb(0 0 0 / .18));
}
.shelf + .shelf-gap { height: 2.6rem; }

.spine {
  flex: none; position: relative; border: 0; padding: 22px 0 18px;
  border-radius: 3px 3px 0 0;
  writing-mode: vertical-rl;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--serif); font-weight: 600; font-size: 1.05rem; letter-spacing: .02em; color: var(--parch);
  white-space: nowrap; gap: 10px;
  box-shadow: inset -7px 0 10px rgb(0 0 0 / .28), inset 3px 0 0 rgb(255 255 255 / .12);
  transition: transform .25s ease;
}
/* gold bands near the top and bottom of each spine */
.spine::before, .spine::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: rgb(255 226 163 / .55); }
.spine::before { top: 10px; }
.spine::after { bottom: 8px; }
.spine.long { font-size: .9rem; }
.spine small { font-family: var(--sans); font-weight: 700; font-size: .7rem; opacity: .8; }
.spine:hover { transform: translateY(-6px); }
.spine[aria-expanded="true"] { transform: translateY(-16px); box-shadow: inset -7px 0 10px rgb(0 0 0 / .28), inset 3px 0 0 rgb(255 255 255 / .12), 0 0 18px rgb(242 178 76 / .55); }
.spine.ot { background: var(--ot); }
.spine.nt { background: var(--nt); }
.spine.topic { background: var(--topic); }
.spine.doctrine { background: var(--doctrine); }
.spine.concept { background: var(--concept); }
.spine.book { background: var(--book); }

/* The book you pulled off the shelf */
.open-book { margin-top: 1.2rem; padding: 1.1rem 1.3rem 1.3rem; background: rgb(255 255 255 / .05); border-top: 3px solid var(--flame); }
.open-book h4 { font-family: var(--serif); font-weight: 400; font-size: 1.7rem; margin: 0; }
.open-book .progress { color: var(--mist); margin: .2rem 0 .9rem; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile {
  width: 52px; height: 52px; border-radius: 8px; border: 1.5px solid var(--flame);
  background: rgb(242 178 76 / .1); font-weight: 700; color: var(--flame-hot); font-size: 1.15rem;
}
.tile:hover { background: var(--flame); color: #1a1230; }

/* Study details sheet */
.sheet-bg { position: fixed; inset: 0; background: rgb(5 6 20 / .6); z-index: 9; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 1.5rem 1.2rem calc(1.6rem + env(safe-area-inset-bottom));
  background: #1b1638; border-top: 2px solid var(--flame);
  transform: translateY(105%); transition: transform .3s ease; visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
@media (min-width: 700px) {
  .sheet { left: auto; right: 24px; bottom: 24px; width: 430px; border: 1px solid var(--flame); border-radius: 12px; }
}
.sheet h4 { font-family: var(--serif); font-weight: 400; font-size: 1.9rem; margin: 0; padding-right: 2rem; }
.sheet .sub { font-family: var(--serif); font-style: italic; color: var(--flame-hot); font-size: 1.15rem; margin: .1rem 0 .5rem; }
.sheet .about { color: var(--mist); line-height: 1.45; margin: 0; }
.sheet .close { position: absolute; top: .6rem; right: .8rem; width: 44px; height: 44px; background: none; border: 0; font-size: 1.7rem; color: var(--mist); }

footer { margin-top: 3rem; color: var(--mist); font-size: .95rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main>
  <h1>Daily Bible Study</h1>
  <p class="intro">Pull a book off the shelf to see every chapter we've studied in it.</p>

  <section class="newest" id="newest" aria-label="Newest study"></section>

  <div id="shelves"></div>

  <footer>Scripture quotations are from the King James Version.</footer>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <button class="close" id="sheet-close" type="button" aria-label="Close">×</button>
  <h4 id="sheet-title"></h4>
  <p class="sub" id="sheet-sub"></p>
  <p class="about" id="sheet-about"></p>
  <div class="btns" id="sheet-btns"></div>
</div>
<div class="sheet-bg" id="sheet-bg"></div>

<script src="studies.js"></script>
<script>
// Bible books in order, with chapter counts (used for spine height and progress)
const BIBLE_BOOKS = [
  ["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],
  ["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],
  ["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],
  ["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],
  ["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],
  ["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],
  ["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],
  ["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],
  ["3 John",1],["Jude",1],["Revelation",22]
];
const BOOK_INDEX = Object.fromEntries(BIBLE_BOOKS.map(([name], k) => [name, k]));
const CHAPTERS = Object.fromEntries(BIBLE_BOOKS);
const FIRST_NT = BOOK_INDEX["Matthew"];
const KINDS = {
  topic: { one: "Topic", many: "Topics" },
  doctrine: { one: "Doctrine", many: "Doctrines" },
  concept: { one: "Concept", many: "Concepts" },
  book: { one: "Book overview", many: "Book overviews" }
};

const studies = window.STUDIES || [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
let openBook = null;

// ---------- Newest study ----------
function drawNewest() {
  const s = [...studies].sort((a, b) => b.date.localeCompare(a.date))[0];
  const box = document.getElementById("newest");
  if (!s) { box.hidden = true; return; }
  box.innerHTML = `<p class="label">Newest study</p>
    <h2>${esc(s.title)}</h2>
    <p class="sub">${esc(s.sub)}</p>
    <div class="btns">${studyButtons(s)}</div>`;
}
function studyButtons(s) {
  return `<a class="btn primary" href="${esc(s.url)}?v=full">Full reading</a><a class="btn" href="${esc(s.url)}?v=key">Key verses</a>`;
}

// ---------- Shelves ----------
function spine(cls, label, note, key, height, width) {
  return `<button class="spine ${cls}${label.length > 9 ? " long" : ""}" type="button" data-key="${esc(key)}" aria-expanded="${openBook === key}"
    style="height:${height}px;width:${width}px" aria-label="${esc(label)}, ${esc(note)}">${esc(label)}<small>${esc(note)}</small></button>`;
}

function drawShelves() {
  const chapters = studies.filter(s => s.type === "chapter" || s.type === "book");
  const books = [...new Set(chapters.map(s => s.book))].sort((a, b) => BOOK_INDEX[a] - BOOK_INDEX[b]);
  const others = studies.filter(s => KINDS[s.type] && s.type !== "book")
    .sort((a, b) => a.type.localeCompare(b.type) || a.title.localeCompare(b.title));
  let html = "";

  if (books.length) {
    const testaments = [...new Set(books.map(b => BOOK_INDEX[b] >= FIRST_NT ? "nt" : "ot"))];
    html += `<div class="shelf-head"><h3>Books of the Bible</h3><ul class="legend">
      ${testaments.includes("ot") ? `<li><span style="background:var(--ot)"></span>Old Testament</li>` : ""}
      ${testaments.includes("nt") ? `<li><span style="background:var(--nt)"></span>New Testament</li>` : ""}</ul></div>
      <div class="shelf">${books.map(b => {
        const n = studies.filter(s => s.type === "chapter" && s.book === b).length;
        // taller for longer books; thicker as more of the book gets studied
        const height = 175 + Math.round(Math.min(CHAPTERS[b], 50) * 1.2);
        const width = Math.min(52 + n * 3, 96);
        return spine(BOOK_INDEX[b] >= FIRST_NT ? "nt" : "ot", b, plural(n, "chapter"), "book:" + b, height, width);
      }).join("")}</div>`;
    if (openBook?.startsWith("book:")) html += drawOpenBook(openBook.slice(5));
  }

  if (others.length) {
    const kinds = [...new Set(others.map(s => s.type))];
    html += `<div class="shelf-gap" style="height:2.6rem"></div>
      <div class="shelf-head"><h3>Topics, doctrines, and more</h3><ul class="legend">
      ${kinds.map(k => `<li><span style="background:var(--${k})"></span>${KINDS[k].many}</li>`).join("")}</ul></div>
      <div class="shelf">${others.map(s => spine(s.type, s.title, KINDS[s.type].one, "study:" + s.id, 215 + (s.title.length % 5) * 7, 58)).join("")}</div>`;
  }

  const root = document.getElementById("shelves");
  root.innerHTML = html;
  root.querySelectorAll("[data-key]").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.key;
    if (key.startsWith("study:")) return openStudy(key.slice(6), b);
    openBook = openBook === key ? null : key;
    drawShelves();
    const panel = document.getElementById("open-book");
    if (panel) panel.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }));
  root.querySelectorAll("[data-study]").forEach(b => b.addEventListener("click", () => openStudy(b.dataset.study, b)));
}

function drawOpenBook(book) {
  const chs = studies.filter(s => s.type === "chapter" && s.book === book).sort((a, b) => a.ch - b.ch);
  const overview = studies.find(s => s.type === "book" && s.book === book);
  return `<div class="open-book" id="open-book">
    <h4>${esc(book)}</h4>
    <p class="progress">${chs.length} of ${CHAPTERS[book]} chapters studied so far</p>
    <div class="tiles">${chs.map(c => `<button class="tile" type="button" data-study="${esc(c.id)}" aria-label="${esc(c.title)}">${c.ch}</button>`).join("")}</div>
    ${overview ? `<div class="btns"><button class="btn" type="button" data-study="${esc(overview.id)}">Book overview</button></div>` : ""}
  </div>`;
}

// ---------- Study sheet ----------
const sheet = document.getElementById("sheet"), sheetBg = document.getElementById("sheet-bg");
let returnFocus = null;
function openStudy(id, from) {
  const s = studies.find(x => x.id === id);
  if (!s) return;
  returnFocus = from;
  document.getElementById("sheet-title").textContent = s.title;
  document.getElementById("sheet-sub").textContent = s.sub;
  document.getElementById("sheet-about").textContent = s.about;
  document.getElementById("sheet-btns").innerHTML = studyButtons(s);
  sheet.classList.add("open"); sheetBg.classList.add("open");
  document.getElementById("sheet-close").focus();
}
function closeStudy() {
  if (!sheet.classList.contains("open")) return;
  sheet.classList.remove("open"); sheetBg.classList.remove("open");
  returnFocus?.focus();
}
document.getElementById("sheet-close").addEventListener("click", closeStudy);
sheetBg.addEventListener("click", closeStudy);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeStudy(); });

drawNewest();
drawShelves();
</script>
</body>
</html>
