<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --slate: #15211e;
  --slate-2: #22332e;
  --brass: #d1a54a;
  --brass-hot: #f0d58c;
  --paper: #efe8d8;
  --sage: #a9b8ad;
  --line: rgb(239 232 216 / .16);
  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Atkinson Hyperlegible', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { font-size: clamp(16px, calc(.7vw + .6vh + 2px), 28px); }
body {
  background: radial-gradient(110% 80% at 85% 0%, var(--slate-2), var(--slate) 60%);
  color: var(--paper); font-family: var(--sans); overflow: hidden;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brass-hot); outline-offset: 3px; }

.deck { position: fixed; inset: 0; }
.slide {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: clamp(16px, 4vh, 56px) clamp(16px, 5vw, 72px) calc(72px + env(safe-area-inset-bottom));
  opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s linear .6s;
}
.slide.active { opacity: 1; visibility: visible; transition: opacity .6s ease; }
.inner { width: min(100%, 60rem); max-height: 100%; overflow-y: auto; scrollbar-width: none; }
.inner::-webkit-scrollbar { display: none; }
.rise { opacity: 0; }
.slide.active .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--d, 0) * 120ms + 120ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }
.eyebrow { color: var(--brass); font-weight: 700; font-size: clamp(.95rem, .85rem + .4vw, 1.2rem); margin-bottom: .5em; }
h2 { font-size: clamp(1.8rem, 1.2rem + 2.6vw, 3.2rem); line-height: 1.1; margin-bottom: .6em; }

/* Chapter cover */
.cover h1 { font-weight: 300; font-size: clamp(4rem, 2rem + 11vw, 10rem); line-height: .95; letter-spacing: -.02em; }
.cover .sub { font-family: var(--serif); font-style: italic; font-size: clamp(1.4rem, 1rem + 2vw, 2.5rem); color: var(--brass-hot); margin-top: .3em; }
.facts { display: grid; gap: .8rem 2.5rem; margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
@media (min-width: 760px) { .facts { grid-template-columns: 1fr 1fr; } }
.facts dt { color: var(--brass); font-weight: 700; font-size: .95rem; }
.facts dd { margin: .15em 0 0; font-size: clamp(1.05rem, .95rem + .5vw, 1.35rem); line-height: 1.4; }
.go-study { display: inline-block; margin-top: 1.8rem; padding: .65em 1.3em; border-radius: 999px; background: var(--brass); color: #1b1608; font-weight: 700; text-decoration: none; }
.go-study:hover { background: var(--brass-hot); }

/* What happens: the story beats are a real sequence, so they're numbered */
.story { list-style: none; margin: 0; padding: 0; counter-reset: beat; display: grid; gap: clamp(.7rem, 1.8vh, 1.2rem); }
.story li { counter-increment: beat; display: grid; grid-template-columns: 2.4rem 1fr; gap: 1rem; align-items: start; font-size: clamp(1.05rem, .92rem + .7vw, 1.5rem); line-height: 1.45; }
.story li::before {
  content: counter(beat); font-family: var(--serif); font-size: 1.6em; line-height: 1; color: var(--brass);
  text-align: right; padding-top: .05em;
}

/* Key verse */
.key .inner { text-align: center; }
.key blockquote { margin: 0 auto; max-width: 30em; font-family: var(--serif); font-size: clamp(1.6rem, 1.1rem + 2.4vw, 3rem); line-height: 1.35; }
.key blockquote::before { content: "\201C"; display: block; font-size: 2.4em; line-height: 1; height: .5em; color: var(--brass); }
.key .eyebrow { margin-bottom: 1.2em; }
.key cite { display: block; margin-top: 1rem; font-style: normal; color: var(--sage); font-size: clamp(1rem, .9rem + .5vw, 1.3rem); }

/* Big idea */
.big-idea { font-family: var(--serif); font-size: clamp(1.5rem, 1.05rem + 2vw, 2.6rem); line-height: 1.3; max-width: 26em; }
.people { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 2rem; padding: 0; list-style: none; }
.people li { padding: .3em .8em; border: 1px solid var(--line); border-radius: 999px; font-size: clamp(.9rem, .85rem + .3vw, 1.1rem); color: var(--sage); }
.people-label { color: var(--brass); font-weight: 700; font-size: .95rem; margin-top: 2.2rem; }
.people-label + .people { margin-top: .6rem; }

/* Book overview: intro and "so far" thread */
.book-intro h1 { font-weight: 300; font-size: clamp(3rem, 1.8rem + 7vw, 7rem); line-height: 1; }
.book-intro .sub { color: var(--sage); font-size: clamp(1.05rem, .95rem + .5vw, 1.35rem); margin-top: .8em; }
.ch-track { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 1.8rem; }
.ch-track span { width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: 6px; font-size: .85rem; border: 1px solid var(--line); color: rgb(239 232 216 / .35); }
.ch-track span.done { background: var(--brass); border-color: var(--brass); color: #1b1608; font-weight: 700; }
.thread { list-style: none; margin: 0 0 0 10px; padding: 0 0 0 1.4rem; border-left: 2px solid var(--brass); display: grid; gap: 1.1rem; }
.thread li { position: relative; }
.thread li::before { content: ""; position: absolute; left: calc(-1.4rem - 7px); top: .45em; width: 12px; height: 12px; border-radius: 50%; background: var(--brass); }
.thread b { font-family: var(--serif); font-weight: 600; font-size: clamp(1.1rem, 1rem + .6vw, 1.45rem); color: var(--brass-hot); }
.thread p { font-size: clamp(1rem, .9rem + .5vw, 1.3rem); line-height: 1.45; margin-top: .15em; }

.missing { text-align: center; }
.missing p { color: var(--sage); margin: 1em 0 1.6em; }

/* Navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; gap: .6rem; padding: .6rem clamp(12px, 3vw, 28px) calc(.6rem + env(safe-area-inset-bottom)); }
.nav button, .nav a { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgb(21 33 30 / .6); color: var(--paper); cursor: pointer; display: grid; place-items: center; }
.nav button:hover, .nav a:hover { border-color: var(--brass); }
.nav svg { width: 20px; height: 20px; }
.track { flex: 1; height: 3px; background: rgb(239 232 216 / .14); border-radius: 3px; position: relative; }
.track span { position: absolute; inset: 0 auto 0 0; background: var(--brass); border-radius: 3px; transition: width .5s ease; }
.count { font-size: .9rem; color: var(--sage); min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="deck" id="deck"></main>

<nav class="nav" aria-label="Slide controls">
  <a href="index.html" aria-label="All studies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></a>
  <button type="button" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button type="button" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="track"><span id="bar"></span></div>
  <span class="count" id="count"></span>
  <button type="button" id="full" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>

<script src="bible.js"></script>
<script src="studies.js"></script>
<script>
// overview.html?id=john-02  → one chapter's overview
// overview.html?book=John   → book overview: every chapter overview in that book, in order
const CHAPTER_COUNTS = Object.fromEntries(window.BIBLE_BOOKS || []);
const params = new URLSearchParams(location.search);
const all = window.STUDIES || [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function chapterSlides(s, inBook) {
  const o = s.overview;
  return `
  <section class="slide cover"><div class="inner">
    ${inBook ? `<p class="eyebrow rise">Chapter ${s.ch}</p>` : `<p class="eyebrow rise">Chapter overview</p>`}
    <h1 class="rise" style="--d:1">${esc(s.title)}</h1>
    <p class="sub rise" style="--d:2">${esc(s.sub)}</p>
    <dl class="facts rise" style="--d:4">
      <div><dt>Where</dt><dd>${esc(o.where)}</dd></div>
      <div><dt>When</dt><dd>${esc(o.when)}</dd></div>
    </dl>
    ${inBook ? "" : `<a class="go-study rise" style="--d:5" href="${esc(s.url)}">Open the full study</a>`}
  </div></section>
  <section class="slide"><div class="inner">
    <p class="eyebrow rise">${esc(s.title)}</p>
    <h2 class="rise" style="--d:1">What happens</h2>
    <ol class="story">${o.story.map((b, k) => `<li class="rise" style="--d:${k + 2}">${esc(b)}</li>`).join("")}</ol>
  </div></section>
  <section class="slide key"><div class="inner">
    <p class="eyebrow rise">The verse to remember</p>
    <blockquote class="rise" style="--d:1">${esc(o.key.text)}</blockquote>
    <cite class="rise" style="--d:3">${esc(o.key.ref)}</cite>
  </div></section>
  <section class="slide"><div class="inner">
    <p class="eyebrow rise">The big idea of ${esc(s.title)}</p>
    <p class="big-idea rise" style="--d:1">${esc(o.big)}</p>
    <p class="people-label rise" style="--d:3">Who's in it</p>
    <ul class="people rise" style="--d:4">${o.people.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
  </div></section>`;
}

function build() {
  const deck = document.getElementById("deck");
  const id = params.get("id"), book = params.get("book");

  if (id) {
    const s = all.find(x => x.id === id && x.overview);
    if (s) {
      document.title = `${s.title} overview`;
      deck.innerHTML = chapterSlides(s, false);
      return;
    }
  }

  if (book) {
    const chs = all.filter(x => x.type === "chapter" && x.book === book && x.overview).sort((a, b) => a.ch - b.ch);
    if (chs.length) {
      const total = CHAPTER_COUNTS[book];
      const done = new Set(chs.map(c => c.ch));
      const intro = all.find(x => x.type === "book" && x.book === book);
      document.title = `${book} overview`;
      deck.innerHTML = `
        <section class="slide book-intro"><div class="inner">
          <p class="eyebrow rise">Book overview</p>
          <h1 class="rise" style="--d:1">${esc(intro ? intro.title : book)}</h1>
          <p class="sub rise" style="--d:2">Chapter by chapter${total ? `, ${chs.length} of ${total} so far` : ""}. This overview grows with every chapter we study.</p>
          ${total ? `<div class="ch-track rise" style="--d:3">${Array.from({ length: total }, (_, k) => `<span class="${done.has(k + 1) ? "done" : ""}">${k + 1}</span>`).join("")}</div>` : ""}
        </div></section>
        ${chs.map(c => chapterSlides(c, true)).join("")}
        <section class="slide"><div class="inner">
          <p class="eyebrow rise">${esc(book)} so far</p>
          <h2 class="rise" style="--d:1">The thread through the chapters</h2>
          <ol class="thread">${chs.map((c, k) => `<li class="rise" style="--d:${k + 2}"><b>${esc(c.title)}</b><p>${esc(c.overview.big)}</p></li>`).join("")}</ol>
        </div></section>`;
      return;
    }
  }

  deck.innerHTML = `<section class="slide missing"><div class="inner">
    <h2>That overview isn't here yet</h2><p>It may not have been written yet.</p>
    <a class="go-study" href="index.html">Back to all studies</a></div></section>`;
}

// ---------- Deck engine ----------
let slides = [], i = 0;
function go(n) {
  if (n < 0 || n >= slides.length) return;
  slides.forEach(s => { s.classList.remove("active"); s.setAttribute("aria-hidden", "true"); });
  i = n;
  slides[i].classList.add("active");
  slides[i].removeAttribute("aria-hidden");
  slides[i].querySelector(".inner").scrollTop = 0;
  const p = slides.length > 1 ? i / (slides.length - 1) : 1;
  document.getElementById("bar").style.width = (p * 100) + "%";
  document.getElementById("count").textContent = `${i + 1} / ${slides.length}`;
  history.replaceState(null, "", location.search + "#" + (i + 1));
}
const next = () => go(i + 1), prev = () => go(i - 1);

document.getElementById("next").addEventListener("click", next);
document.getElementById("prev").addEventListener("click", prev);
document.getElementById("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
});
document.addEventListener("keydown", e => {
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) {
    if ((e.key === "Enter" || e.key === " ") && e.target.closest("button, a")) return;
    e.preventDefault(); next();
  } else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(slides.length - 1);
  else if (e.key === "f") document.getElementById("full").click();
});
document.getElementById("deck").addEventListener("click", e => {
  if (e.target.closest("button, a")) return;
  if (window.getSelection().toString()) return;
  e.clientX < window.innerWidth * 0.3 ? prev() : next();
});
let tx = null, ty = null;
document.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? next() : prev();
  tx = ty = null;
});

build();
slides = [...document.querySelectorAll(".slide")];
const fromHash = parseInt(location.hash.slice(1), 10);
go(Number.isFinite(fromHash) ? Math.min(Math.max(fromHash - 1, 0), slides.length - 1) : 0);
</script>
</body>
</html>
